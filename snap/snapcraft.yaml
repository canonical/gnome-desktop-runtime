name: gnome-desktop-runtime
version: "0.1"
summary: GNOME desktop content for Ubuntu Core Desktop
description: |
  GNOME desktop packages for Ubuntu Core Desktop, exposed through the
  standard content interface to a confined desktop session snap.

type: app
base: core26
grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

slots:
  gnome-desktop-runtime:
    content: gnome-desktop-runtime
    interface: content
    read: ["."]

layout:
  /usr/share/gnome-session:
    bind: $SNAP/usr/share/gnome-session
  /usr/libexec/gnome-session-init-worker:
    bind-file: $SNAP/usr/libexec/gnome-session-init-worker
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.5:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.5
  /usr/share/pipewire:
    symlink: $SNAP/usr/share/pipewire
  /usr/share/wireplumber:
    symlink: $SNAP/usr/share/wireplumber

apps:
  # GDM starts the greeter session through this confined GNOME Session
  # leader. Its name selects the narrowly generated systemd-user-control
  # rules for starting the greeter's declared user units.
  ubuntu-desktop-session:
    command: usr/bin/gnome-session
    plugs:
      - systemd-user-control

plugs:
  systemd-user-control:
    interface: systemd-user-control

parts:
  desktop-content:
    plugin: nil
    stage:
      - -usr/libexec/xdg-desktop-portal
      # Keep host-owned GDM integration in core; this snap supplies the
      # daemon/runtime payload, not a second service or host PAM setup.
      - -etc/gdm3
      - -etc/pam.d/gdm-*
      - -usr/lib/systemd/system/gdm.service
      - -usr/lib/systemd/system/gdm3.service
      - -usr/lib/systemd/system/display-manager.service
      - -usr/lib/systemd/user/org.freedesktop.IBus.session.GNOME.service
      - -usr/lib/systemd/user/org.freedesktop.IBus.session.generic.service
      - -usr/lib/systemd/user/gnome-session.target.wants/org.freedesktop.IBus.session.GNOME.service
      # These services are activated by the session snap's D-Bus apps.
      - -usr/lib/systemd/user/colord-session.service
      - -usr/lib/systemd/user/xdg-desktop-portal.service
      - -usr/lib/systemd/user/xdg-desktop-portal-gnome.service
      - -usr/lib/systemd/user/xdg-desktop-portal-gtk.service
      - -usr/lib/systemd/user/xdg-document-portal.service
      - -usr/lib/systemd/user/xdg-permission-store.service
      - -usr/lib/systemd/user/tinysparql-xdg-portal-3.service
      - -usr/share/dbus-1/services/org.freedesktop.ColorHelper.service
      - -usr/share/dbus-1/services/org.freedesktop.IBus.service
      - -usr/share/dbus-1/services/org.freedesktop.portal.IBus.service
      - -usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.gnome.service
      - -usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.gtk.service
      - -usr/share/dbus-1/services/org.freedesktop.impl.portal.PermissionStore.service
      - -usr/share/dbus-1/services/org.freedesktop.impl.portal.Secret.service
      - -usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service
      - -usr/share/dbus-1/services/org.freedesktop.portal.Documents.service
      - -usr/share/dbus-1/services/org.freedesktop.portal.Tracker.service
      - -usr/share/dbus-1/services/org.gnome.Nautilus.service
      - -usr/share/dbus-1/services/org.gnome.ControlCenter.service
      - -usr/share/dbus-1/services/org.gnome.ControlCenter.SearchProvider.service
      - -usr/share/dbus-1/services/org.gnome.Settings.service
      - -usr/share/dbus-1/services/org.gnome.Settings.GlobalShortcutsProvider.service
      - -usr/share/dbus-1/services/org.gnome.Settings.SearchProvider.service
      - -usr/share/dbus-1/services/org.gnome.Shell.Screencast.service
      - -usr/share/dbus-1/services/org.gnome.Terminal.service
    stage-packages:
      # desktop-packages
      - fonts-ubuntu
      - im-config
      - libspa-0.2-bluetooth
      - xdg-utils
      - xkb-data

      # gdm-packages
      - xwayland
      - gdm3
      - libgl1-mesa-dri
      - rust-coreutils
      - zenity
      - yaru-theme-gtk
      - yaru-theme-gnome-shell
      - yaru-theme-icon
      - ubuntu-settings
      - xdg-user-dirs
      - pulseaudio-utils
      - alsa-utils
      - libgsound0
      - gsound-tools
      - gir1.2-gsound-1.0
      - libcanberra-pulse
      - libsnapd-glib-2-1
      - ibus
      - pipewire-bin
      - wireplumber
      - libglib2.0-bin
      - libglib2.0-0t64

      # gnome-desktop-components
      - ubuntu-session
      - gkbd-capplet
      - gnome-menus
      - gnome-terminal
      - gnome-settings-daemon
      - gnome-shell-extension-appindicator
      - gnome-shell-extension-desktop-icons-ng
      - gnome-shell-extension-ubuntu-dock
      - gnome-shell-extension-ubuntu-tiling-assistant
      - gnome-control-center
      - gnome-keyring
      - spice-vdagent
      - xdg-desktop-portal
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - xdg-user-dirs-gtk
      - alsa-ucm-conf
    override-prime: |
      craftctl default

      # udisks2/UPower are system-bus daemons, not user-session payload.
      # They are provided by their own provider snaps (Stage 3B); their
      # debs only get staged here transitively (gvfs-daemons Depends
      # udisks2, gnome-control-center Depends upower). The daemon-side
      # files are inert inside a content mount anyway: the host systemd
      # and system dbus-daemon cannot see unit or activation files below
      # /snap/gnome-desktop-runtime. Keep only the client-side payload
      # the session processes actually use (libudisks2, libupower-glib
      # and their typelibs, the gvfs volume monitor and its activation
      # files).
      rm -rf "$CRAFT_PRIME/etc/udisks2" "$CRAFT_PRIME/etc/UPower"
      rm -rf "$CRAFT_PRIME/etc/libblockdev"
      rm -f "$CRAFT_PRIME/usr/bin/udisksctl" "$CRAFT_PRIME/usr/bin/upower"
      rm -f "$CRAFT_PRIME/usr/sbin/umount.udisks2"
      rm -rf "$CRAFT_PRIME/usr/lib/udisks2"
      rm -rf "$CRAFT_PRIME/usr/libexec/udisks2"
      rm -f "$CRAFT_PRIME/usr/libexec/upowerd"
      rm -f "$CRAFT_PRIME/usr/lib/systemd/system/udisks2.service"
      rm -f "$CRAFT_PRIME/usr/lib/systemd/system/upower.service"
      rm -f "$CRAFT_PRIME/usr/lib/tmpfiles.d/udisks2.conf"
      rm -f "$CRAFT_PRIME/usr/lib/udev/rules.d/80-udisks2.rules"
      rm -f "$CRAFT_PRIME/usr/lib/udev/rules.d/60-upower-battery.rules"
      rm -f "$CRAFT_PRIME/usr/lib/udev/rules.d/95-upower-hid.rules"
      rm -f "$CRAFT_PRIME/usr/lib/udev/rules.d/95-upower-wup.rules"
      rm -f "$CRAFT_PRIME/usr/lib/udev/hwdb.d/60-upower-battery.hwdb"
      rm -f "$CRAFT_PRIME/usr/lib/udev/hwdb.d/95-upower-hid.hwdb"
      rm -f "$CRAFT_PRIME/usr/share/dbus-1/system-services/org.freedesktop.UDisks2.service"
      rm -f "$CRAFT_PRIME/usr/share/dbus-1/system.d/org.freedesktop.UDisks2.conf"
      rm -f "$CRAFT_PRIME/usr/share/dbus-1/system-services/org.freedesktop.UPower.service"
      rm -f "$CRAFT_PRIME/usr/share/dbus-1/system.d/org.freedesktop.UPower.conf"
      rm -f "$CRAFT_PRIME/usr/share/apport/package-hooks/udisks2.py"
      rm -f "$CRAFT_PRIME/usr/share/apport/package-hooks/libatasmart4.py"
      rm -f "$CRAFT_PRIME/usr/share/bash-completion/completions/udisksctl"
      rm -rf "$CRAFT_PRIME/usr/share/doc/libblockdev"* \
        "$CRAFT_PRIME/usr/share/doc/libatasmart4" \
        "$CRAFT_PRIME/usr/share/doc/libbytesize1" \
        "$CRAFT_PRIME/usr/share/doc/libbytesize-common" \
        "$CRAFT_PRIME/usr/share/doc/libnvme1t64" \
        "$CRAFT_PRIME/usr/share/doc/libvolume-key1" \
        "$CRAFT_PRIME/usr/share/doc/udisks2" \
        "$CRAFT_PRIME/usr/share/doc/upower"
      rm -f "$CRAFT_PRIME/usr/share/lintian/overrides/libblockdev"* \
        "$CRAFT_PRIME/usr/share/lintian/overrides/libnvme1t64"
      rm -f "$CRAFT_PRIME/usr/share/man/man1/udisksctl.1.gz" \
        "$CRAFT_PRIME/usr/share/man/man1/upower.1.gz" \
        "$CRAFT_PRIME/usr/share/man/man5/udisks2.conf.5.gz" \
        "$CRAFT_PRIME/usr/share/man/man7/UPower.7.gz" \
        "$CRAFT_PRIME/usr/share/man/man8/udisks.8.gz" \
        "$CRAFT_PRIME/usr/share/man/man8/udisksd.8.gz" \
        "$CRAFT_PRIME/usr/share/man/man8/umount.udisks2.8.gz" \
        "$CRAFT_PRIME/usr/share/man/man8/upowerd.8.gz"
      rm -f "$CRAFT_PRIME/usr/share/zsh/site-functions/_udisks2" \
        "$CRAFT_PRIME/usr/share/zsh/site-functions/_upower"
      rm -f "$CRAFT_PRIME/usr/share/polkit-1/actions/org.freedesktop.UDisks2.policy" \
        "$CRAFT_PRIME/usr/share/polkit-1/actions/org.freedesktop.upower.policy"
      rm -rf "$CRAFT_PRIME/var/lib/upower"
      # libblockdev and its plugin modules, plus libatasmart/libbytesize/
      # libnvme/libvolume_key, are udisksd's daemon-side plugin stack
      # (pulled in only via the udisks2 deb); no user-session process
      # links them.
      rm -rf "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libbd_"*
      rm -f "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libblockdev.so.3"*
      rm -f "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libatasmart.so.4"*
      rm -f "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libbytesize.so.1"*
      rm -f "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libnvme.so.1"*
      rm -f "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libnvme-mi.so.1"*
      rm -f "$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvolume_key.so.1"*

      install -d "$CRAFT_PRIME/usr/bin"
      ln -sfn ../lib/cargo/bin/coreutils/dircolors \
        "$CRAFT_PRIME/usr/bin/dircolors"
      cat > "$CRAFT_PRIME/usr/share/glib-2.0/schemas/90_ubuntu-core-desktop-background.gschema.override" <<'EOF'
      [org.gnome.desktop.background]
      picture-uri = 'file:///usr/share/backgrounds/warty-final-ubuntu.png'
      picture-uri-dark = 'file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
      EOF
      LD_LIBRARY_PATH="$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_PRIME/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_PRIME/usr/lib:$CRAFT_PRIME/lib" \
        "$CRAFT_PRIME/usr/bin/glib-compile-schemas" \
        "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      test -f "$CRAFT_PRIME/usr/share/glib-2.0/schemas/gschemas.compiled"

      gnome_shell_data="$CRAFT_PRIME/usr/share/gnome-shell"
      ln -sfn theme/Yaru/gnome-shell-theme.gresource \
        "$gnome_shell_data/gdm-theme.gresource"
      ln -sfn theme/Yaru/gnome-shell-icons.gresource \
        "$gnome_shell_data/gdm-icons.gresource"

      initial_setup_mode="$gnome_shell_data/modes/initial-setup.json"
      mkdir -p "$(dirname "$initial_setup_mode")"
      cat > "$initial_setup_mode" <<'EOF'
      {
      "stylesheetName": "Yaru/gnome-shell.css",
      "colorScheme": "prefer-light",
      "themeResourceName": "theme/Yaru/gnome-shell-theme.gresource",
      "iconsResourceName": "theme/Yaru/gnome-shell-icons.gresource",
          "hasWindows": true,
          "components": ["networkAgent"],
          "panel": { "left": [],
                     "center": [],
                     "right": ["a11y", "keyboard", "quickSettings"]
          }
      }
      EOF

      pixbuf_dir="$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0"
      pixbuf_loaders="$pixbuf_dir/2.10.0/loaders"
      pixbuf_query="$pixbuf_dir/gdk-pixbuf-query-loaders"
      pixbuf_cache="$pixbuf_dir/2.10.0/loaders.cache"
      test -x "$pixbuf_query"
      test -d "$pixbuf_loaders"
      pixbuf_modules=()
      for module in "$pixbuf_loaders"/*.so; do
        [ -f "$module" ] || continue
        pixbuf_modules+=("$module")
      done
      if [ "${#pixbuf_modules[@]}" -eq 0 ]; then
        echo "No GDK Pixbuf loader modules found in $pixbuf_loaders" >&2
        exit 1
      fi
      LD_LIBRARY_PATH="$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_PRIME/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$CRAFT_PRIME/usr/lib:$CRAFT_PRIME/lib" \
        "$pixbuf_query" "${pixbuf_modules[@]}" |
        sed "s|$CRAFT_PRIME|/snap/gnome-desktop-runtime/current|g" \
          > "$pixbuf_cache"
      test -s "$pixbuf_cache"
      touch -d "2099-01-01" "$pixbuf_cache"

  xdg-desktop-portal-patched:
    after:
      - desktop-content
    plugin: nil
    source: .
    build-packages:
      - bubblewrap
      - build-essential
      - curl
      - dpkg-dev
      - libflatpak-dev
      - libfuse3-dev
      - libgdk-pixbuf-2.0-dev
      - libgeoclue-2-dev
      - libglib2.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgudev-1.0-dev
      - libjson-glib-dev
      - libpipewire-0.3-dev
      - libsystemd-dev
      - meson
      - ninja-build
      - pkg-config
    override-build: |
      set -eu

      changelog="${CRAFT_STAGE}/usr/share/doc/xdg-desktop-portal/changelog.Debian.gz"
      version="$(gzip -dc "${changelog}" | sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p')"
      if [ -z "${version}" ]; then
        echo "Could not determine the staged xdg-desktop-portal version" >&2
        exit 1
      fi

      source_version="$(printf '%s\n' "${version}" | cut -d- -f1)"
      source_url="https://archive.ubuntu.com/ubuntu/pool/main/x/xdg-desktop-portal"
      cd "${CRAFT_PART_BUILD}"
      curl --fail --location --silent --show-error \
        "${source_url}/xdg-desktop-portal_${version}.dsc" \
        --output "xdg-desktop-portal_${version}.dsc"
      curl --fail --location --silent --show-error \
        "${source_url}/xdg-desktop-portal_${source_version}.orig.tar.xz" \
        --output "xdg-desktop-portal_${source_version}.orig.tar.xz"
      curl --fail --location --silent --show-error \
        "${source_url}/xdg-desktop-portal_${version}.debian.tar.xz" \
        --output "xdg-desktop-portal_${version}.debian.tar.xz"

      source_dir="${CRAFT_PART_BUILD}/source"
      # Re-extracting over a previous incremental run's tree would fail
      # dpkg-source's "unpack target exists" check; start clean each time.
      rm -rf "${source_dir}"
      dpkg-source --extract "xdg-desktop-portal_${version}.dsc" "${source_dir}"
      patch --strip=1 --directory="${source_dir}" \
        < "${CRAFT_PART_SRC}/patches/xdg-desktop-portal-defer-backend-activation.patch"

      build_dir="${CRAFT_PART_BUILD}/build"
      # Ditto for the meson build tree: a stale configured directory from
      # a previous incremental run makes `meson setup` fail.
      rm -rf "${build_dir}"
      meson setup "${build_dir}" "${source_dir}" \
        --prefix=/usr \
        --libexecdir=libexec \
        -Ddocumentation=disabled \
        -Dflatpak-interfaces=enabled \
        -Dgeoclue=enabled \
        -Dgudev=enabled \
        -Dinstalled-tests=false \
        -Dman-pages=disabled \
        -Dsystemd=enabled \
        -Dtests=disabled
      meson compile -C "${build_dir}"
      install_root="${CRAFT_PART_BUILD}/install"
      DESTDIR="${install_root}" meson install --no-rebuild -C "${build_dir}"
      install -D -m 0755 \
        "${install_root}/usr/libexec/xdg-desktop-portal" \
        "${CRAFT_PART_INSTALL}/usr/libexec/xdg-desktop-portal"
